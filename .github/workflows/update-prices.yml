name: Update market prices

on:
  schedule:
    - cron: "17 */3 * * *"   # ทุก 3 ชั่วโมง (เวลา UTC)
  workflow_dispatch: {}       # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices from Albion Online Data Project (Asia)
        run: node scripts/update-prices.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
